<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>生日轉盤</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="wrap">
        <div class="barrier" id="barrier">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content birthday-modal">

                    <div class="modal-header">
                        <div class="birthday-icon">🎂</div>
                        <h5 class="modal-title">給妳的小小規則 ❤️</h5>
                    </div>
                    <div class="modal-body">
                        <div class="rule-item">
                            <span class="rule-icon">🎡</span>
                            <div class="w-100">
                                <strong>3 次機會</strong>
                                <p>妳有 3 次機會轉動幸運轉盤</p>
                            </div>
                        </div>

                        <div class="rule-item">
                            <span class="rule-icon">💰</span>
                            <div class="w-100">
                                <strong>取最高金額</strong>
                                <p>3 次結果中，最高金額就是妳的生日禮物</p>
                            </div>
                        </div>

                        <div class="rule-item special-rule">
                            <span class="rule-icon">✨</span>
                            <div class="w-100">
                                <strong>特殊獎勵</strong>
                                <p>
                                    如果連續 3 次抽中相同金額<br>
                                    <span>獎金直接 ×3！🎉</span>
                                </p>
                            </div>
                        </div>

                        <div class="ready-text">
                            Are you ready? 😏❤️
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn birthday-btn" id="modal-close">
                            開始我的生日驚喜 🎁
                        </button>
                    </div>

                </div>
            </div>
        </div>
        <div class="wheel">
            <canvas id="wheel" width="500" height="500"></canvas>
            <div class="pointer" id="pointer">▼</div>
        </div>
        <button id="spin" class="bnt btn-lg mb-3 spin">開始抽獎</button>

        <div class="history" id="history">
            <div class="history-title">幸運紀錄 🍀</div>
        </div>

        <div class="result-overlay d-none" id="resultModal">
            <div class="result-modal">
                <div class="result-confetti">
                    🎉
                </div>

                <div class="result-title">
                    恭喜妳！
                </div>

                <div class="result-text">
                    妳的生日禮物是
                </div>

                <div class="result-money" id="resultMoney">

                </div>

                <div class="result-birthday">
                    生日快樂 ❤️
                </div>

                <button id="resultClose" class="result-btn">
                    收下生日禮物 🎁
                </button>

            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
